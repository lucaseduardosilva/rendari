version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rendari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rendari_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rendari}
    ports:
      - "5432:5432"
    volumes:
      - rendari_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rendari}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rendari}:${POSTGRES_PASSWORD:-rendari_dev}@postgres:5432/${POSTGRES_DB:-rendari}?schema=public
    ports:
      - "3333:3333"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3333
    ports:
      - "5173:5173"

volumes:
  rendari_pgdata:
